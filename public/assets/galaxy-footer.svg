<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop stop-color="#080b0d"/>
      <stop offset=".7" stop-color="#020405"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="mist">
      <stop stop-color="#84f1df" stop-opacity=".34"/>
      <stop offset=".3" stop-color="#54cdbd" stop-opacity=".22"/>
      <stop offset="1" stop-color="#24968f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetMist">
      <stop stop-color="#bd8cff" stop-opacity=".4"/>
      <stop offset=".34" stop-color="#7658e8" stop-opacity=".23"/>
      <stop offset="1" stop-color="#583ecb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseMist">
      <stop stop-color="#ff9ecf" stop-opacity=".32"/>
      <stop offset=".35" stop-color="#e96fb8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c849aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldMist">
      <stop stop-color="#ffe9a3" stop-opacity=".34"/>
      <stop offset=".35" stop-color="#f2b95f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#da8a42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop stop-color="#fffde1"/>
      <stop offset=".05" stop-color="#fff9c4" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#e8f3c3" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d5f3d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .028" numOctaves="3" seed="8" result="noise">
        <animate attributeName="baseFrequency" dur="35s" values=".012 .028;.016 .034;.012 .028" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40"/>
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="haze"><feGaussianBlur stdDeviation="34"/></filter>
    <style>
      .starfield { transform-box: fill-box; transform-origin: center; animation: fly-through 2.8s linear infinite; }
      .starfield.second { animation-delay: -1.4s; }
      .starfield.third { animation-delay: -2.25s; }
      .star-glow { transform-box: fill-box; transform-origin: center; animation: sparkle 2.8s ease-in-out infinite alternate; }
      .mist-drift { animation: cloud-drift 22s ease-in-out infinite alternate; }
      .mist-drift.reverse { animation-duration: 29s; animation-direction: alternate-reverse; }
      .flare { transform-box: fill-box; transform-origin: center; animation: flare 5s ease-in-out infinite; }
      .flare:nth-child(2n) { animation-delay: -2.5s; }
      .nebula { animation: drift 38s ease-in-out infinite alternate; }
      @keyframes fly-through {
        0% { opacity: 0; transform: scale(.24); }
        12% { opacity: .95; }
        78% { opacity: 1; }
        100% { opacity: 0; transform: scale(2.7); }
      }
      @keyframes sparkle { from { opacity: .45; } to { opacity: 1; } }
      @keyframes flare { 0%, 100% { opacity: .55; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes drift { from { transform: translate(-18px, 8px) scale(1); } to { transform: translate(18px, -10px) scale(1.08); } }
      @keyframes cloud-drift { from { transform: translate(-35px, 14px) scale(.96); } to { transform: translate(38px, -18px) scale(1.1); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#space)"/>
  <g class="nebula" filter="url(#cloud)" opacity=".9">
    <ellipse cx="80" cy="325" rx="250" ry="160" fill="url(#mist)"/>
    <ellipse cx="1480" cy="170" rx="230" ry="175" fill="url(#mist)"/>
    <ellipse cx="1220" cy="510" rx="260" ry="120" fill="url(#mist)" opacity=".42"/>
  </g>
  <g class="mist-drift" filter="url(#cloud)" opacity=".85">
    <ellipse cx="520" cy="120" rx="290" ry="160" fill="url(#violetMist)"/>
    <ellipse cx="1030" cy="410" rx="330" ry="150" fill="url(#roseMist)"/>
  </g>
  <g class="mist-drift reverse" filter="url(#cloud)" opacity=".8">
    <ellipse cx="870" cy="105" rx="230" ry="130" fill="url(#goldMist)"/>
    <ellipse cx="270" cy="470" rx="280" ry="115" fill="url(#violetMist)"/>
    <ellipse cx="1390" cy="350" rx="220" ry="145" fill="url(#roseMist)"/>
  </g>
  <ellipse cx="95" cy="320" rx="210" ry="125" fill="url(#mist)" filter="url(#haze)" opacity=".42"/>
  <ellipse cx="1490" cy="165" rx="190" ry="130" fill="url(#mist)" filter="url(#haze)" opacity=".38"/>

  <g class="starfield" fill="#f4fbff">
    <circle class="dust" cx="38" cy="38" r="1.1"/><circle class="dust" cx="98" cy="154" r="1.4"/><circle class="dust" cx="142" cy="72" r=".8"/>

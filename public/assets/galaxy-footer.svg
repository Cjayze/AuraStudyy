  <g class="flare star-glow" transform="translate(148 146)">
    <circle r="55" fill="url(#glow)"/><path d="M0-37V37M-37 0H37M-25-25L25 25M25-25L-25 25" stroke="#e9f6cc" stroke-opacity=".58" stroke-width=".8"/>
    <circle r="3.5" fill="#fffde0"/>
  </g>
  <g class="flare star-glow" transform="translate(1324 90) scale(.72)">
    <circle r="52" fill="url(#glow)"/><path d="M0-35V35M-35 0H35M-24-24L24 24M24-24L-24 24" stroke="#e9f6cc" stroke-opacity=".55" stroke-width=".8"/>
    <circle r="3" fill="#fffde0"/>
  </g>

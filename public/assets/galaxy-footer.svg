    <circle class="dust" cx="690" cy="448" r=".9"/><circle class="dust" cx="744" cy="164" r="1.1"/><circle class="dust" cx="796" cy="336" r=".8"/>
    <circle class="dust" cx="852" cy="68" r="1.3"/><circle class="dust" cx="900" cy="240" r=".9"/><circle class="dust" cx="955" cy="408" r="1.2"/>
    <circle class="dust" cx="1008" cy="120" r=".8"/><circle class="dust" cx="1060" cy="310" r="1.4"/><circle class="dust" cx="1112" cy="42" r=".9"/>
    <circle class="dust" cx="1164" cy="202" r="1.1"/><circle class="dust" cx="1210" cy="450" r=".8"/><circle class="dust" cx="1260" cy="93" r="1.3"/>
    <circle class="dust" cx="1314" cy="276" r=".9"/><circle class="dust" cx="1362" cy="390" r="1.2"/><circle class="dust" cx="1418" cy="52" r=".8"/>
    <circle class="dust" cx="1470" cy="330" r="1.3"/><circle class="dust" cx="1535" cy="115" r="1"/><circle class="dust" cx="1570" cy="470" r=".9"/>
    <circle class="dust" cx="75" cy="470" r=".7"/><circle class="dust" cx="304" cy="220" r=".7"/><circle class="dust" cx="550" cy="470" r=".8"/>
    <circle class="dust" cx="716" cy="390" r=".7"/><circle class="dust" cx="935" cy="112" r=".7"/><circle class="dust" cx="1090" cy="476" r=".8"/>
    <circle class="dust" cx="1284" cy="180" r=".7"/><circle class="dust" cx="1508" cy="238" r=".8"/><circle class="dust" cx="438" cy="40" r=".7"/>
    <circle cx="20" cy="218" r=".7"/><circle cx="62" cy="296" r=".6"/><circle cx="118" cy="420" r=".8"/><circle cx="176" cy="34" r=".6"/>
    <circle cx="229" cy="475" r=".7"/><circle cx="278" cy="318" r=".6"/><circle cx="340" cy="154" r=".8"/><circle cx="390" cy="476" r=".6"/>
    <circle cx="450" cy="252" r=".7"/><circle cx="501" cy="144" r=".6"/><circle cx="566" cy="40" r=".7"/><circle cx="616" cy="218" r=".6"/>
    <circle cx="665" cy="306" r=".8"/><circle cx="730" cy="478" r=".6"/><circle cx="774" cy="80" r=".7"/><circle cx="824" cy="438" r=".6"/>
    <circle cx="880" cy="340" r=".8"/><circle cx="922" cy="474" r=".6"/><circle cx="980" cy="42" r=".8"/><circle cx="1032" cy="230" r=".6"/>
    <circle cx="1080" cy="388" r=".7"/><circle cx="1135" cy="154" r=".6"/><circle cx="1180" cy="300" r=".8"/><circle cx="1238" cy="482" r=".6"/>
    <circle cx="1295" cy="42" r=".7"/><circle cx="1340" cy="458" r=".6"/><circle cx="1390" cy="224" r=".8"/><circle cx="1440" cy="148" r=".6"/>
    <circle cx="1495" cy="488" r=".7"/><circle cx="1552" cy="286" r=".6"/><circle cx="1580" cy="42" r=".7"/><circle cx="184" cy="198" r=".6"/>
    <circle cx="244" cy="70" r=".7"/><circle cx="355" cy="290" r=".6"/><circle cx="487" cy="480" r=".7"/><circle cx="540" cy="195" r=".6"/>
    <circle cx="606" cy="124" r=".7"/><circle cx="680" cy="226" r=".6"/><circle cx="752" cy="258" r=".7"/><circle cx="832" cy="178" r=".6"/>
    <circle cx="895" cy="42" r=".7"/><circle cx="972" cy="280" r=".6"/><circle cx="1040" cy="480" r=".7"/><circle cx="1120" cy="350" r=".6"/>
    <circle cx="1192" cy="70" r=".7"/><circle cx="1270" cy="214" r=".6"/><circle cx="1332" cy="330" r=".7"/><circle cx="1406" cy="482" r=".6"/>
    <circle cx="1460" cy="424" r=".7"/><circle cx="1522" cy="174" r=".6"/><circle cx="1572" cy="218" r=".7"/><circle cx="28" cy="388" r=".6"/>
  </g>

